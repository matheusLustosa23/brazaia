[project]
name = "iobraza"
version = "0.1.0"
description = "Assistente pessoal de IA, voz-first, multi-device, local (Qwen3-VL via vLLM)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "pydantic-settings>=2.14.1",
    "orjson>=3.10",
    "openai>=2.41.1",
    "tenacity>=9.1.4",
    "transformers>=5.12.0",
    "aiosqlite>=0.22.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pyright]
# Type-checker do projeto (mesmo motor do Pylance no VS Code).
# É o que "cobra" os contratos Protocol — equivalente Pythonic ao compilador exigindo `implements`.
include = ["."]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false


[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]          # <- faltava; sem isso 'core'/'domain' não importam
markers = ["integration: bate no vLLM real (pula se fora)"]
